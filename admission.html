<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Application</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
        }

        /* Initial Page Load Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding: 20px; /* Reduced padding for mobile */
            margin: 0;
            overflow-x: hidden;
        }

        .form-container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out;
            box-sizing: border-box;
        }

        .banner-img {
            max-width: 100%;
            height: auto;
            transition: transform 0.5s ease;
        }

        .banner-img:hover {
            transform: scale(1.02);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        fieldset {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        fieldset:hover {
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.05);
        }

        legend {
            font-weight: bold;
            color: var(--accent-color);
            padding: 0 10px;
            font-size: 1.1em;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Desktop layout */
            gap: 20px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #fff;
            font-size: 16px; /* Prevents auto-zoom on mobile devices */
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.2);
            transform: translateX(5px);
        }

        .full-width {
            grid-column: span 2;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%; /* Default full-width for easier mobile tap */
            max-width: 300px;
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        button.success {
            background-color: var(--success-color);
        }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr; /* Stack inputs into one column on mobile */
            }
            .full-width {
                grid-column: span 1;
            }
            .form-container {
                padding: 20px;
            }
            h2 {
                font-size: 1.2rem;
            }
            input:focus, select:focus, textarea:focus {
                transform: none; /* Disable shift animation on small screens for better UX */
            }
        }
    </style>
</head>

<body>

    <div class="form-container">
        <center>
            <img src="images/mm-removebg-preview.png" class="img-fluid banner-img" width="80%" alt="School Logo">
        </center>
        <h2>Student Admission Application</h2>

        <form id="admissionForm">

            <fieldset>
                <legend>Student Information</legend>
                <div class="form-group">
                    <div>
                        <label for="first_name">First Name *</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div>
                        <label for="last_name">Last Name *</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label for="dob">Date of Birth *</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div>
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="full-width">
                        <label for="birth_cert">Birth Certificate Number *</label>
                        <input type="text" id="birth_cert" name="birth_cert"
                            placeholder="Please enter numbers only." required
                            oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label for="grade">Grade *</label>
                        <select id="grade" name="grade" required>
                            <option value="">Select Grade</option>
                            <option value="1">Grade 1</option>
                            <option value="2">Grade 2</option>
                            <option value="3">Grade 3</option>
                            <option value="4">Grade 4</option>
                            <option value="5">Grade 5</option>
                            <option value="6">Grade 6</option>
                            <option value="7">Grade 7</option>
                            <option value="8">Grade 8</option>
                            <option value="9">Grade 9</option>
                        </select>
                    </div>
                    <div>
                        <label for="section">Section *</label>
                        <select id="section" name="section" required>
                            <option value="">Select Section</option>
                            <option value="english">English Version</option>
                            <option value="bangla">Bangla Medium</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Parents Information</legend>
                <div class="form-group">
                    <div>
                        <label for="father_name">Father's Name *</label>
                        <input type="text" id="father_name" name="father_name" required>
                    </div>
                    <div>
                        <label for="f_phone">Father's Phone Number *</label>
                        <input type="tel" id="f_phone" name="f_phone" required pattern="[0-9]{11}" minlength="11"
                            maxlength="11" title="Please enter exactly 11 digits"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="e.g. 017XXXXXXXX">
                    </div>
                </div>
                <div class="form-group">
                    <div class="full-width">
                        <label for="f_occ">Father's Occupation</label>
                        <input type="text" id="f_occ" name="f_occ">
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label for="mother_name">Mother's Name *</label>
                        <input type="text" id="mother_name" name="mother_name" required>
                    </div>
                    <div>
                        <label for="m_phone">Mother's Phone Number *</label>
                        <input type="tel" id="m_phone" name="m_phone" required pattern="[0-9]{11}" minlength="11"
                            maxlength="11" title="Please enter exactly 11 digits"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="e.g. 017XXXXXXXX">
                    </div>
                </div>
                <div class="form-group">
                    <div>
                        <label for="m_occ">Mother's Occupation</label>
                        <input type="text" id="m_occ" name="m_occ">
                    </div>
                    <div>
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Additional Details</legend>
                <div class="form-group">
                    <div class="full-width">
                        <label for="address">Residential Address *</label>
                        <textarea id="address" name="address" rows="3" required></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <div class="full-width">
                        <label for="medical">Medical Report / Allergies (If any)</label>
                        <textarea id="medical" name="medical" rows="2"
                            placeholder="Describe any medical conditions..."></textarea>
                    </div>
                </div>
            </fieldset>

            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" id="submitBtn">Submit Application</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>
        (function () {
            emailjs.init("Qy1FDf6pxRh-mYnK6");
        })();

        document.getElementById("admissionForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const btn = document.getElementById("submitBtn");
            const originalText = btn.innerText;
            
            // Visual feedback for sending
            btn.innerText = "Processing...";
            btn.disabled = true;
            btn.style.opacity = "0.7";

            emailjs.sendForm("service_6le2wyp", "template_q5j6pp5", this)
                .then(function () {
                    // Success Animation
                    btn.innerText = "✓ Application Sent!";
                    btn.classList.add("success");
                    btn.style.opacity = "1";
                    
                    setTimeout(() => {
                        window.location.href = "Confirmation.html";
                    }, 1500);
                }, function (error) {
                    alert("Failed to send: " + JSON.stringify(error));
                    btn.innerText = originalText;
                    btn.disabled = false;
                    btn.style.opacity = "1";
                });
        });
    </script>

</body>
</html>
